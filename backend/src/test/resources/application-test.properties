spring.application.name=backend
server.port=0

spring.data.mongodb.auto-index-creation=true

# Security
jwt.secret=this-is-a-mock-jwt-secret-key-for-testing-purposes-that-is-at-least-64-bytes-long

# Cloudflare R2
r2.account-id=test-account-id
r2.access-key=test-access-key
r2.secret-key=test-secret-key
r2.bucket-rulebooks=test-bucket-rulebooks
r2.bucket-profiles=test-bucket-profiles
r2.bucket-listings=test-bucket-listings
r2.rulebooks.public-dev-url=http://localhost:8080/mock-r2-rulebooks
r2.listings.endpoint=http://localhost:8080/mock-r2-listings
r2.rulebooks.public-prod-url=http://localhost:8080/mock-r2-rulebooks-prod
r2.listings.prod.endpoint=http://localhost:8080/mock-r2-listings-prod
r2.dev-url=http://localhost:8080/mock-r2-dev
r2.prod-url=http://localhost:8080/mock-r2-prod


# External Api
bgg.token=${BGG_TOKEN}
bgg.url=${BGG_URL}
google.maps.api-key=test-google-maps-api-key

spring.jackson.mapper.accept-case-insensitive-enums=true
spring.web.resources.add-mappings=false
logging.level.org.springframework.boot.context.config=DEBUG
logging.level.org.springframework.web.socket=DEBUG