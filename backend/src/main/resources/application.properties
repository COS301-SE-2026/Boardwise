spring.application.name=backend
spring.mongodb.uri=${DEV_DB_URL}
spring.mongodb.database=boardwise
ai.gateway.url=${DEV_FAST_API_BASE}
ai.gateway.internal-secret=${INTERNAL_SECRET}
spring.data.mongodb.auto-index-creation=true

server.port=8080

jwt.secret=${JWT_SECRET}

# Cloudflare R2
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket-rulebooks=${R2_BUCKET_RULEBOOKS}
r2.bucket-profiles=${R2_BUCKET_PROFILES}
r2.bucket-listings=${R2_BUCKET_LISTINGS}
r2.rulebooks.public-url=${R2_RULEBOOKS_PUBLIC_URL}
r2.listings.public-url=${R2_LISTINGS_ENDPOINT}
r2.profiles.public-url=${R2_DEV_URL} 

# BGG STUFF
bgg.token=${BGG_TOKEN}
bgg.url=${BGG_URL}

# Popularity score stuff
popularity.refresh.interval.ms=60000
popularity.refresh.batch-size=20
popularity.weights.owned=0.40
popularity.weights.users-rated=0.25
popularity.weights.bayes-average=0.20
popularity.weights.owned-per-year=0.15
popularity.internal.weights.owned=0.6
popularity.internal.weights.contact-inquiries=0.4
popularity.internal.reference.owned=1000
popularity.internal.reference.contact-inquiries=100
popularity.blend.k=50

# Frontend
frontend.base.url=${DEV_FRONTEND_BASE}

# jackson stuff
spring.jackson.mapper.accept-case-insensitive-enums=true

logging.level.org.springframework.boot.context.config=DEBUG

spring.web.resources.add-mappings=false

#SCRAPER
scraper.service.url=${SCRAPER_SERVICE_URL}

nominatim.service.url=${NOMINATIM_SERVICE_URL}

# EMAIL
spring.mail.host=${SMTP_HOST}
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# I just need it
system.contributor.id=${SYSTEM_CONTRIBUTOR_ID}