name: Production Release Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --------------------------------------------------
  # Phase 1: AI Gateway Gating
  # --------------------------------------------------
  ai-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Verify Environment
        run: pip install -r requirements.txt pytest httpx
      - name: Execute Test Suite
        run: pytest tests/

  # --------------------------------------------------
  # Phase 2: Backend Compilation & Packaging
  # --------------------------------------------------
  backend-gate:
    runs-on: ubuntu-latest
    needs: ai-gate # <--- AI must pass first
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile and Package Executable JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package

  # --------------------------------------------------
  # Phase 3: Production Frontend Compilation
  # --------------------------------------------------
  frontend-gate:
    runs-on: ubuntu-latest
    needs: backend-gate # <--- Backend must pass first
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Build Production Assets
        run: |
          npm ci
          npm run build