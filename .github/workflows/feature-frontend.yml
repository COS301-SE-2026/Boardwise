name: Feature - Nuxt Frontend

on:
  push:
    branches: [ "dev" ]
    paths: [ "frontend/**" ]
  pull_request:
    branches: [ "dev" ]
    paths: [ "frontend/**" ]
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Dependencies
        run: npm ci
      - name: Build Check
        run: npm run build
