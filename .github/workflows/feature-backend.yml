name: Feature - Java Backend

on:
  push:
    branches: [ "dev" ]
    paths: [ "backend/**" ]
  pull_request:
    branches: [ "dev"]
    paths: [ "backend/**" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Verifies the code compiles properly without running tests
      - name: Build and Verify Code Compilation
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean compile